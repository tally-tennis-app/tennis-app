version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      # TypeScript arrives as its own pull request. Its majors wait on
      # typescript-eslint support, and grouping it blocks every other update.
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - typescript
    ignore:
      # Types track the Node runtime in .nvmrc and package.json engines, not the
      # newest Node release. Bump this major by hand with the runtime.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # ESLint 10 removed context.getFilename(). eslint-plugin-react, vendored
      # inside eslint-config-next, still calls it, so every rule in that plugin
      # throws on load and `npm run lint` exits before linting anything. Scoped
      # to the broken major so 11.x is proposed normally; delete this once
      # eslint-config-next ships a patched eslint-plugin-react.
      - dependency-name: "eslint"
        versions:
          - "10.x"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:e2e

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Migrations are applied from an empty database, so a migration that only
      # works against an already-migrated schema fails here.
      - name: Start Supabase and apply migrations
        run: npx supabase start

      - name: Reset the database from migrations
        run: npx supabase db reset

      # Policy tests run as unprivileged roles. Without this job the
      # "policy tests in the same pull request" rule in CONTRIBUTING.md would
      # have no enforcement.
      - name: Run Row Level Security policy tests
        run: npx supabase test db

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Journeys that write data run here, against this job's throwaway stack,
      # never against the shared project (docs/product-questions.md). Without
      # these variables the same specs skip themselves in the quality job.
      - name: Run end-to-end journeys against the local stack
        run: |
          status="$(npx supabase status -o json 2>/dev/null)"
          export NEXT_PUBLIC_SUPABASE_URL="$(jq -r .API_URL <<<"$status")"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$(jq -r .PUBLISHABLE_KEY <<<"$status")"
          export E2E_LOCAL_SUPABASE_PUBLISHABLE="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          export E2E_LOCAL_SUPABASE_SECRET="$(jq -r .SECRET_KEY <<<"$status")"
          npx playwright test

      # This machine has no container runtime, so the generated types are
      # produced here and downloaded to be committed. Once committed, this step
      # doubles as the schema-drift alarm: regenerate and diff.
      - name: Generate database types
        run: npx supabase gen types typescript --local > database.types.generated.ts

      - name: Upload database types
        uses: actions/upload-artifact@v7
        with:
          name: database-types
          path: database.types.generated.ts

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

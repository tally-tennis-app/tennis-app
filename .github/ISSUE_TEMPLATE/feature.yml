name: Product idea
description: Propose a user problem or product improvement.
title: "[Idea]: "
labels: [product]
body:
  - type: textarea
    id: problem
    attributes:
      label: Player problem
      description: What is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the successful result without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or context
      description: Add player feedback, examples, or relevant links.
